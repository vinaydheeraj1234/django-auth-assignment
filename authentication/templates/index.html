<!DOCTYPE html>
<html>
<head>
    <title>Auth Test</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 30px auto; }
        .box { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 5px; }
        input { display: block; width: 95%; padding: 6px; margin: 5px 0; }
        button { padding: 6px 12px; margin-top: 5px; }
        pre { background: #f4f4f4; padding: 10px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h2>Authentication Test Page</h2>

    <div class="box">
        <h3>1. Register</h3>
        <input id="reg-email" type="email" placeholder="Email">
        <input id="reg-password" type="password" placeholder="Password">
        <button onclick="register()">Register</button>
    </div>

    <div class="box">
        <h3>2. Verify OTP</h3>
        <input id="otp-email" type="email" placeholder="Email">
        <input id="otp-code" type="text" placeholder="OTP">
        <button onclick="verifyOtp()">Verify</button>
    </div>

    <div class="box">
        <h3>3. Login</h3>
        <input id="login-email" type="email" placeholder="Email">
        <input id="login-password" type="password" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>

    <div class="box">
        <h3>4. My Details / Logout</h3>
        <button onclick="getMe()">Get My Details</button>
        <button onclick="logout()">Logout</button>
    </div>

    <h3>Response</h3>
    <pre id="output">Nothing yet</pre>

    <script>
        // read the csrftoken cookie (django sets it when this page opens)
        function getCookie(name) {
            let cookies = document.cookie.split(";");
            for (let c of cookies) {
                c = c.trim();
                if (c.startsWith(name + "=")) {
                    return c.substring(name.length + 1);
                }
            }
            return "";
        }

        async function callApi(url, method, data) {
            let options = {
                method: method,
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie("csrftoken"),
                },
                credentials: "same-origin", // send cookies with the request
            };
            if (data) {
                options.body = JSON.stringify(data);
            }
            let res = await fetch(url, options);
            let json = await res.json();
            document.getElementById("output").textContent =
                res.status + "\n" + JSON.stringify(json, null, 2);
        }

        function register() {
            callApi("/api/register/", "POST", {
                email: document.getElementById("reg-email").value,
                password: document.getElementById("reg-password").value,
            });
        }

        function verifyOtp() {
            callApi("/api/register/verify/", "POST", {
                email: document.getElementById("otp-email").value,
                otp: document.getElementById("otp-code").value,
            });
        }

        function login() {
            callApi("/api/login/", "POST", {
                email: document.getElementById("login-email").value,
                password: document.getElementById("login-password").value,
            });
        }

        function getMe() {
            callApi("/api/me/", "GET");
        }

        function logout() {
            callApi("/api/logout/", "POST");
        }
    </script>
</body>
</html>
